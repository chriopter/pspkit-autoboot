<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 840" width="500" height="840" font-family="Helvetica, Arial, sans-serif">
  <title>ESP32-C3 in a PSP-1000 battery shell (to scale, 57 × 36 mm)</title>
  <defs>
    <style>
      .wire { fill: none; stroke: #1f6feb; stroke-width: 3; stroke-linejoin: round; }
      .gnd  { fill: none; stroke: #8b949e; stroke-width: 3; stroke-linejoin: round; }
      .pwr  { fill: none; stroke: #e5534b; stroke-width: 3; stroke-linejoin: round; }
      .pin  { font-size: 13px; fill: #f6f8fa; font-family: Menlo, Consolas, monospace; }
      .pinr { font-size: 13px; fill: #f6f8fa; font-family: Menlo, Consolas, monospace; text-anchor: end; }
      .val  { font-size: 13px; fill: #d0d7de; }
      .con  { font-size: 15px; font-weight: bold; fill: #24292f; text-anchor: middle; }
      .part { fill: #e6edf3; }
    </style>
  </defs>

  <rect width="500" height="840" rx="16" fill="#f3ede4"/>

  <!-- PSP-1000 battery shell, 36 × 57 mm at 12 px/mm, contact end stepped up by 4 mm -->
  <path d="M 30 128 L 290 128 L 318 80 L 450 80 Q 462 80 462 92 L 462 752 Q 462 764 450 764 L 42 764 Q 30 764 30 752 Z"
        fill="#2b2b2e" stroke="#111" stroke-width="3"/>
  <path d="M 42 140 L 296 140 L 324 92 L 450 92 L 450 752 L 42 752 Z" fill="#35353a"/>

  <!-- contacts (inside view) -->
  <rect x="330" y="66" width="120" height="46" rx="4" fill="#1b1b1d" stroke="#000"/>
  <rect x="341" y="74" width="18" height="30" fill="#c9a227"/>
  <rect x="381" y="74" width="18" height="30" fill="#c9a227"/>
  <rect x="421" y="74" width="18" height="30" fill="#c9a227"/>
  <text x="350" y="56" class="con">−</text>
  <text x="390" y="56" class="con">DATA</text>
  <text x="430" y="56" class="con">+</text>

  <!-- ESP32-C3 SuperMini, 18 × 22.5 mm -->
  <rect x="54" y="150" width="216" height="270" rx="6" fill="#111827" stroke="#000"/>
  <text x="66" y="174" font-size="13" font-weight="bold" fill="#e5e7eb">ESP32-C3</text>
  <text x="66" y="191" font-size="12" fill="#9ca3af">SuperMini</text>
  <!-- ESP32-C3 QFN32, 5 × 5 mm -->
  <rect x="72" y="230" width="60" height="60" rx="4" fill="#1f2937" stroke="#4b5563"/>
  <!-- header pads, 2.54 mm pitch; only the used ones labelled -->
  <g fill="#d4a017">
    <circle cx="258" cy="180" r="5" opacity="0.35"/><circle cx="258" cy="210" r="6"/>
    <circle cx="258" cy="241" r="6"/><circle cx="258" cy="271" r="6"/>
    <circle cx="258" cy="302" r="6"/><circle cx="258" cy="332" r="5" opacity="0.35"/>
    <circle cx="258" cy="363" r="6"/><circle cx="258" cy="393" r="5" opacity="0.35"/>
  </g>
  <text x="246" y="215" class="pinr">GND</text>
  <text x="246" y="246" class="pinr">GPIO4</text>
  <text x="246" y="276" class="pinr">GPIO5</text>
  <text x="246" y="307" class="pinr">GPIO7</text>
  <text x="246" y="368" class="pinr">5V</text>

  <!-- USB-C receptacle (8.94 × 7.35 mm) at the board edge, plug overmold 11 × 18 mm, cable Ø 3.5 mm -->
  <rect x="108" y="334" width="108" height="90" rx="10" fill="#c0c4c9" stroke="#6b7280"/>
  <rect x="96" y="424" width="132" height="216" rx="14" fill="#4b5563"/>
  <path d="M 162 640 C 162 700 170 760 170 840" stroke="#4b5563" stroke-width="42" fill="none"/>

  <!-- GND → − , down to 2.2k -->
  <polyline class="gnd" points="264,210 350,210 350,104"/>
  <polyline class="gnd" points="350,210 350,480 362,480"/>
  <circle cx="350" cy="210" r="5" fill="#8b949e"/>

  <!-- DATA: GPIO5 → DATA; GPIO4 through diode (cathode at GPIO4); GPIO7 through 10k -->
  <polyline class="wire" points="264,271 390,271 390,104"/>
  <circle cx="310" cy="271" r="5" fill="#1f6feb"/>
  <polyline class="wire" points="264,241 272,241"/>
  <rect x="272" y="229" width="4" height="24" class="part"/>
  <polygon points="276,241 298,230 298,252" class="part"/>
  <polyline class="wire" points="298,241 310,241 310,271"/>
  <text x="266" y="203" class="val">1N4148</text>
  <polyline class="wire" points="264,302 270,302"/>
  <rect x="270" y="294" width="30" height="16" rx="3" fill="#8ecae6" stroke="#1f6feb" stroke-width="2"/>
  <polyline class="wire" points="300,302 310,302 310,271"/>
  <text x="270" y="328" class="val">10k</text>

  <!-- 5V → 2 diodes → + (crosses GND without connection) -->
  <polyline class="pwr" points="264,363 272,363"/>
  <polygon points="272,352 272,374 294,363" class="part"/><rect x="294" y="352" width="4" height="22" class="part"/>
  <polyline class="pwr" points="298,363 306,363"/>
  <polygon points="306,352 306,374 328,363" class="part"/><rect x="328" y="352" width="4" height="22" class="part"/>
  <polyline class="pwr" points="332,363 430,363"/>
  <circle cx="430" cy="363" r="5" fill="#e5534b"/>
  <polyline class="pwr" points="430,480 430,104"/>
  <text x="268" y="395" class="val">2× diode</text>

  <!-- 2.2k between + and − -->
  <rect x="362" y="472" width="56" height="16" rx="3" fill="#8ecae6" stroke="#8b949e" stroke-width="2"/>
  <polyline class="pwr" points="418,480 430,480"/>
  <circle cx="430" cy="480" r="5" fill="#e5534b"/>
  <text x="366" y="510" class="val">2.2k</text>
</svg>
